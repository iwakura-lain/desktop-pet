name: Build Desktop Pet

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Windows build (Linux runner via game-ci)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Windows)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build project (Windows)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:    2022.3.62f1
          targetPlatform:  StandaloneWindows64
          buildName:       desktop-pet
          buildsPath:      build
          customParameters: -nographics
          sceneList:       Assets/Scenes/Main.unity

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows-${{ github.ref_name }}
          path: build/StandaloneWindows64
          retention-days: 7

      - name: Zip Windows build
        run: zip -r desktop-pet-windows-${{ github.ref_name }}.zip build/StandaloneWindows64/

      - name: Upload Windows zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       Desktop Pet ${{ github.ref_name }}
          draft:      false
          prerelease: false
          files:      desktop-pet-windows-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS Universal Binary build (macOS runner required for ObjC plugin)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build StandaloneOSX (Universal)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (macOS)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneOSX-
            Library-

      - name: Compile ObjC plugin into Universal bundle
        run: |
          MM=Assets/Plugins/macOS/DesktopPetBridge.mm
          OUT=Assets/Plugins/macOS/DesktopPetBridge.bundle
          # Compile for arm64
          clang -arch arm64 -fobjc-arc -fmodules -lc++ \
            -framework Cocoa -framework QuartzCore -framework Metal \
            -dynamiclib -o /tmp/bridge_arm64.dylib "$MM"
          # Compile for x86_64
          clang -arch x86_64 -fobjc-arc -fmodules -lc++ \
            -framework Cocoa -framework QuartzCore -framework Metal \
            -dynamiclib -o /tmp/bridge_x86_64.dylib "$MM"
          # Combine into Universal binary bundle
          mkdir -p "$OUT/Contents/MacOS"
          lipo -create /tmp/bridge_arm64.dylib /tmp/bridge_x86_64.dylib \
            -output "$OUT/Contents/MacOS/DesktopPetBridge"
          # Create minimal Info.plist
          cat > "$OUT/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>DesktopPetBridge</string>
            <key>CFBundleIdentifier</key><string>com.defaultcompany.desktoppetbridge</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
          </dict></plist>
          PLIST
          echo "Bundle built:"
          file "$OUT/Contents/MacOS/DesktopPetBridge"

      - name: Build project (macOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:    2022.3.62f1
          targetPlatform:  StandaloneOSX
          buildName:       desktop-pet
          buildsPath:      build
          customParameters: -architecture Universal
          allowDirtyBuild: true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-macos-${{ github.ref_name }}
          path: build/StandaloneOSX
          retention-days: 7

      - name: Zip macOS build
        run: zip -r desktop-pet-macos-${{ github.ref_name }}.zip build/StandaloneOSX/

      - name: Upload macOS zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       Desktop Pet ${{ github.ref_name }}
          draft:      false
          prerelease: false
          files:      desktop-pet-macos-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
