name: Build Windows Desktop Pet

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:    2022.3.62f1
          targetPlatform:  StandaloneWindows64
          buildName:       desktop-pet
          buildsPath:      build
          customParameters: -nographics
          sceneList:       Assets/Scenes/Main.unity

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows-${{ github.ref_name }}
          path: build/StandaloneWindows64
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name:     Desktop Pet ${{ github.ref_name }}
          draft:    false
          prerelease: false
          files: build/StandaloneWindows64/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
